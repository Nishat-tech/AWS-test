name: Backend CI/CD

on:
  push:
    branches:
      - backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # This step now only installs dependencies and runs tests.
      # If you don't have tests, you can remove "&& npm test"
      - name: Install Dependencies and Run Tests
        run: cd backend && npm install && npm test
